# ==============================================================================
# Antminer T9+ Zynq-7000 STM32 SWD Interface Configuration (linuxgpiod)
# ==============================================================================
# Hardware mapping on 3.3V Hashboard Header J3 (Banks 34 & 35):
# J3 Pin 3  (P16) -> SWCLK (EMIO 0 / GPIO Line 54)
# J3 Pin 4  (P15) -> SWDIO (EMIO 1 / GPIO Line 55, Bidirectional IOBUF)
# J3 Pin 5  (T14) -> nRST  (EMIO 2 / GPIO Line 56, Bidirectional IOBUF, open-drain)
# J3 Pin 6  (T10) -> BOOT0 (EMIO 3 / GPIO Line 57, Bidirectional IOBUF)
# ==============================================================================

adapter driver linuxgpiod
linuxgpiod_gpiochip 0
linuxgpiod_swd_nums 54 55
linuxgpiod_srst_num 56

transport select swd

# Reset configuration: SRST (nRST) is open-drain
reset_config srst_only srst_open_drain connect_deassert_srst

# Network bindings (bind to all interfaces so clients can connect over Ethernet)
bindto 0.0.0.0
gdb_port 3333
telnet_port 4444
tcl_port 6666
