# ==============================================================================
# Antminer T9+ Zynq-7000 STM32 SWD Interface Configuration (sysfsgpio)
# ==============================================================================
# Base GPIO chip: 512
# EMIO 0 (SWCLK) -> 512 + 54 = 566
# EMIO 1 (SWDIO) -> 512 + 55 = 567
# EMIO 2 (nRST)  -> 512 + 56 = 568
# EMIO 3 (BOOT0) -> 512 + 57 = 569
# ==============================================================================

adapter driver sysfsgpio
sysfsgpio_swd_nums 566 567
sysfsgpio_srst_num 568

transport select swd
reset_config srst_only srst_open_drain connect_deassert_srst

bindto 0.0.0.0
gdb_port 3333
telnet_port 4444
tcl_port 6666
